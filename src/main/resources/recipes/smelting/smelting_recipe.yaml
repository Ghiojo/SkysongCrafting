# Icon for the Recipe crafting icon
icon: "RED_WOOL"

# Type of recipe: SHAPED, SHAPELESS, SHAPED_MARKING or SHAPELESS_MARKING
recipe_type: "SHAPELESS"

# Craftsman table type the recipe was made for
table_type: "craftsman"

# Sound to play when crafting the item, use PaperMC's "sound" enums
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
sound: "block.furnace.fire_crackle"

# Name of the recipe that shows up on the icon
name: "Smelting Recipe"

# Output of the recipe, must be formatted like "type:filename". Type must be the folder name.
# Filename does not include the .yaml extension.
output: "basic:basic_output"

# Skill level required to craft the item, format is "skill:level".
# skill: a skill id or alias from SkysongStats' skills.yml (e.g. metalworking, metal, mistgathering, tande).
#        Anything else is an invalid skill and the recipe is not loaded.
# level: a level id or name from skills.yml (e.g. novice), or an amount of XP, which means the level that XP reaches.
# A player can craft when their skill level is the required level or higher.
# This can be left empty if no skill is required.
skill_requirements:
  - "metalworking:novice"

# Ingredients of the recipe as material_id values, in any order. For multiple of the same item, use *(number)
# at the end (e.g. item1*3 for 3 of item1). Use "#tag_id" to accept any item of a tag (see tags/).
inputs:
  - "item1"
  - "item2*2"
