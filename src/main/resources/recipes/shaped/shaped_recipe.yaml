# Icon for the Recipe crafting icon
icon: "RED_WOOL"

# Type of recipe: SHAPED, SHAPELESS, SHAPED_MARKING or SHAPELESS_MARKING
recipe_type: "SHAPED"

# Craftsman table type the recipe was made for
table_type: "craftsman"

# Sound to play when crafting the item, use PaperMC's "sound" enums
# https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html
sound: "entity.villager.work_toolsmith"

# Name of the recipe that shows up on the icon
name: "Shaped Recipe"

# Output of the recipe, must be formatted like "type:filename". Type must be the folder name.
# Filename does not include the .yaml extension.
output: "basic:basic_output"

# Skill experience required to craft the item, format is "skill:amount"
skill_requirements:
  - "smithing:16"

# Ingredients of the recipe in a 5x5 grid, use "" for empty slots.
# The strings in each slot are the SkysongItems material_id of the required item. Use "#tag_id" to accept any item of a tag.
# Suffixes change how a slot is consumed: "wand^2" takes 2 charges instead of the item, "anvil!keep" leaves it. See docs/RECIPE_FORMAT.md.
pattern:
  - [ "","","","","" ]
  - [ "","","","","" ]
  - [ "","","","","" ]
  - [ "","","","","" ]
  - [ "","","","","" ]
