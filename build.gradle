plugins {
    id 'java'
}

// The api module is configured first so its classes can be added to the plugin jar below.
evaluationDependsOn(':api')

group = 'org.skysongdev'
version = '1.0'

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    // The SkysongItems and SkysongStats APIs are published from their git repositories by JitPack.
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

dependencies {
    // The public API (api/), published on its own by JitPack. Its classes ship inside this jar.
    implementation project(':api')
    compileOnly "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    // Only the public APIs: both plugins are installed on the server (plugin.yml depend).
    compileOnly "com.github.Ghiojo:Skysong-Special-Items:1.2.0"
    compileOnly "com.github.Ghiojo:SkysongStats:1.0.0"

    // Unit tests cover the pure parts (template parsing, recipe-key helpers).
    // paper-api is needed at test time for YamlConfiguration; no server is started.
    testImplementation "io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT"
    testImplementation "com.github.Ghiojo:Skysong-Special-Items:1.2.0"
    testImplementation "com.github.Ghiojo:SkysongStats:1.0.0"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

// The api classes ship inside the plugin jar, so the server has exactly one copy of them.
// Plugins that use the API compile against it with compileOnly and never shade it.
tasks.named('jar') {
    from(project(':api').sourceSets.main.output)
}
